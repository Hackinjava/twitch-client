<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Client Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 350px;
      background: #0e0e10;
      color: #efeff1;
      font-family: 'Inter', Arial, sans-serif;
      padding: 15px;
    }
    h2 { color: #9147ff; margin-bottom: 15px; font-size: 18px; }
    .section { margin-bottom: 20px; padding: 10px; background: #18181b; border-radius: 8px; }
    .section-title { font-size: 14px; color: #adadb8; margin-bottom: 10px; }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 8px;
      background: #000;
      border: 1px solid #3a3a3d;
      color: #efeff1;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #9147ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 5px;
    }
    button:hover { background: #772ce8; }
    button.stop { background: #eb0400; }
    button.stop:hover { background: #c40000; }
    .status { font-size: 12px; color: #00f593; margin-top: 5px; }
    .donation-log { max-height: 100px; overflow-y: auto; font-size: 11px; }
    .donation-entry { padding: 5px; border-bottom: 1px solid #3a3a3d; }
  </style>
</head>
<body>
  <h2>🎮 Twitch Simulator</h2>
  
  <div class="section">
    <div class="section-title">Followers (1-1000)</div>
    <input type="number" id="followerInput" min="1" max="1000" value="100">
    <button id="setFollowers">Set Followers</button>
    <div class="status" id="followerStatus">Current: 100</div>
  </div>

  <div class="section">
    <div class="section-title">Chat Spam</div>
    <input type="text" id="spamMessage" placeholder="Enter message...">
    <button id="startSpam">Start Spam</button>
    <button id="stopSpam" class="stop">Stop Spam</button>
    <div class="status" id="spamStatus">Inactive</div>
  </div>

  <div class="section">
    <div class="section-title">Fake Donations</div>
    <button id="generateDonation">Generate Donation</button>
    <div class="donation-log" id="donationLog"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
